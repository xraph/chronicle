name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Creating tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify build
        run: |
          set -e
          for dir in $(make -s print-modules); do
            echo "==> $dir"
            (cd "$dir" && go mod download && go build ./... && go test -race -count=1 ./...)
          done

      # The nested modules release with the root, at the same version, on the
      # same commit. Without their tags a consumer can't fetch
      # store/postgres@<tag>. The list matches TAGGED in the Makefile;
      # internal/backendtest only holds tests and is never tagged.
      - name: Tag nested modules
        env:
          TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAGGED=$(make -s print-tagged)
          for dir in $TAGGED; do
            if git rev-parse -q --verify "refs/tags/$dir/$TAG" >/dev/null; then
              echo "$dir/$TAG already exists"
              continue
            fi
            git tag "$dir/$TAG"
            git push origin "$dir/$TAG"
          done

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ---

            ### Installation

            ```bash
            go get github.com/xraph/chronicle@${{ steps.set-tag.outputs.tag }}
            ```

            The stores, the handler and the Forge extension are their own modules. Get the ones you import at the same version, for example:

            ```bash
            go get github.com/xraph/chronicle/store/postgres@${{ steps.set-tag.outputs.tag }}
            go get github.com/xraph/chronicle/extension@${{ steps.set-tag.outputs.tag }}
            ```
          generate_release_notes: true
