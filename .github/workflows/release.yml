name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The root and the nested modules (TAGGED in the Makefile) release
      # together, at one version, on one commit. scripts/release-tags.sh pushes
      # whichever of those tags are missing in one atomic push.
      #
      # When someone pushed the root tag, it's already public, so the nested
      # tags go out straight away: a root nobody can get the stores for is
      # worse than a set that fails verify. A dispatched release verifies
      # first and only then pushes every tag.
      - name: Tag nested modules (root tag pushed)
        if: github.event_name == 'push'
        run: scripts/release-tags.sh "${{ steps.set-tag.outputs.tag }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify build
        run: |
          set -e
          MODULES=$(make -s print-modules)
          if [ -z "$MODULES" ]; then
            echo "::error::make print-modules listed no modules"
            exit 1
          fi
          for dir in $MODULES; do
            echo "==> $dir"
            (cd "$dir" && go mod download && go build ./... && go test -race -count=1 ./...)
          done

      - name: Tag the root and nested modules (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: scripts/release-tags.sh "${{ steps.set-tag.outputs.tag }}"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ---

            ### Installation

            ```bash
            go get github.com/xraph/chronicle@${{ steps.set-tag.outputs.tag }}
            ```

            The stores, the handler and the Forge extension are their own modules. Get the ones you import at the same version, for example:

            ```bash
            go get github.com/xraph/chronicle/store/postgres@${{ steps.set-tag.outputs.tag }}
            go get github.com/xraph/chronicle/extension@${{ steps.set-tag.outputs.tag }}
            ```
          generate_release_notes: true

  # Once the release is out, move every repo that depends on chronicle onto
  # it and release them in dependency order. Prereleases don't cascade.
  cascade:
    name: Cascade to dependents
    needs: release
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    uses: ./.github/workflows/cascade.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets:
      CASCADE_TOKEN: ${{ secrets.CASCADE_TOKEN }}
