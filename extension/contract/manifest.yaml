schemaVersion: 1
contributor:
  name: chronicle
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [chronicle.read, chronicle.write]

# Every query is capability: read and every command capability: write;
# loader.Validate enforces that pairing.
#
# verify.run and verify.event are queries with no side effects, but a verdict
# is only true of the rows at the moment it ran, so the client never caches
# them. As a second line of defence they are also listed under every command
# that can change what they would say: a checkpoint, a policy change and a
# purge. The other reads are cached, and each command lists what it changes.
intents:
  # One chain. There is exactly one per app and tenant, so with no input it
  # is the viewer's own, resolved from scope. An optional streamId names
  # another chain the viewer owns, which is how an app-wide viewer reaches a
  # tenant's chain. verify.run, checkpoints.list and checkpoints.take take the
  # same optional streamId.
  - { name: streams.mine, kind: query, version: 1, capability: read }
  # Every chain inside the viewer's own app (or own tenant), for operators
  # who look after more than one tenant. It never crosses an app boundary.
  # Deliberately absent from the React plugin's nav.
  - { name: streams.list, kind: query, version: 1, capability: read }
  # Both are queries -- verification has no side effects of its own -- but
  # their results must NOT be cached by the client keyed on (stream, from,
  # to) or on the event ID. A verdict is only true of the row's state at the
  # moment it ran: the same range or the same event can be rewritten a
  # moment later, and a cached "valid" would keep saying so after the row no
  # longer is. They are lazy on the client (an explicit run, not a mount-time
  # fetch), so the client's useQuery needs an `enabled` option, and they stay
  # queries rather than becoming commands.
  - { name: verify.run,   kind: query, version: 1, capability: read }
  - { name: verify.event, kind: query, version: 1, capability: read }
  # One chain's signed checkpoints (the viewer's own, or the chain named by
  # streamId). checkpoints.list carries no total -- see
  # CheckpointListResponse's doc in handlers_checkpoints.go -- only hasMore,
  # computed by fetching one row past the requested page.
  - { name: checkpoints.list,   kind: query, version: 1, capability: read }
  - { name: checkpoints.detail, kind: query, version: 1, capability: read }
  # Write, not admin: taking a checkpoint creates a record and destroys
  # nothing. It is the one write that makes future verification stronger. It
  # needs a write grant (the manifest's capability is not checked against the
  # user by the transport), and either scope satisfies it. A new checkpoint
  # is the latest checkpoint that streams.mine and streams.list report, and
  # changes what a subsequent verification can prove, so verify.run is
  # invalidated too.
  - { name: checkpoints.take, kind: command, version: 1, capability: write,
      requires: { any: ["scope:chronicle.write", "scope:chronicle.admin"] },
      invalidates: [checkpoints.list, streams.mine, streams.list, verify.run] }
  # The audit log's search surface. events.byUser is its own intent rather
  # than reusing events.list with a userId filter: it is backed by
  # Store.Query with UserID set, not by Store.ByUser, whose Total is only the
  # returned page's length on every backend and would misstate the count on
  # the wire.
  - { name: events.list,      kind: query, version: 1, capability: read }
  - { name: events.detail,    kind: query, version: 1, capability: read }
  - { name: events.aggregate, kind: query, version: 1, capability: read }
  - { name: events.byUser,    kind: query, version: 1, capability: read }
  # The overview page's count tiles and breakdowns: total, critical, failed
  # (failure only, as in the report stats), denied, erasures, and the
  # category/severity/outcome groups they are derived from. The page's single
  # "failed" tile is failed plus denied and sums the two fields itself.
  - { name: overview.stats, kind: query, version: 1, capability: read }
  # GDPR erasure records: the evidence that a data subject's right to
  # erasure was honoured. There is no erasures.request here yet: a confirmed
  # library bug means crypto.KeyStore keys an encryption key by subject ID
  # alone, so an erasure requested in one app or tenant destroys another
  # app's or tenant's data for the same subject. The command stays out of
  # this manifest until the library scopes its keys.
  - { name: erasures.list,   kind: query, version: 1, capability: read }
  - { name: erasures.detail, kind: query, version: 1, capability: read }
  # The count a confirm dialog would show before an erasure command fires.
  # A query, so it is lazy on the client and runs when the dialog opens, not
  # on every render of the list.
  - { name: erasures.preview, kind: query, version: 1, capability: read }
  # Retention policies and the enforcement that purges audit events. Every
  # intent here is confined to the viewer's own app and tenant; no request
  # carries an appId or tenantId.
  - { name: retention.policies,     kind: query, version: 1, capability: read }
  - { name: retention.policyDetail, kind: query, version: 1, capability: read }
  # Creates or updates a policy in the viewer's own scope. It deletes
  # nothing by itself, but the background scheduler enforces every policy
  # on its next run, so a "*" policy with a tiny duration, or a shortened
  # one, purges history without anyone calling retention.enforce. That makes
  # it as destructive in effect as enforce, so it carries the admin scope
  # too. A duration of zero or less is refused outright.
  # verify.run is invalidated because its report counts the policies that can
  # purge the chain.
  - { name: retention.savePolicy,   kind: command, version: 1, capability: write,
      requires: { all: ["scope:chronicle.admin"] },
      invalidates: [retention.policies, retention.policyDetail, retention.preview,
                    verify.run] }
  # Deleting a policy switches off that category's retention, so it carries
  # the explicit admin scope on top of write.
  - { name: retention.deletePolicy, kind: command, version: 1, capability: write,
      requires: { all: ["scope:chronicle.admin"] },
      invalidates: [retention.policies, retention.policyDetail, retention.preview,
                    verify.run] }
  # What enforcement would purge if it ran now, for the confirm dialog in
  # front of retention.enforce. It loads at most 10,000 events per policy
  # and says when it was capped. Its counts are eligible events; one enforce
  # pass purges at most 5,000 per policy.
  - { name: retention.preview,      kind: query, version: 1, capability: read }
  # Purges audit events permanently, so it carries the explicit admin scope.
  # It runs only the viewer's own policies, never the scheduler's global
  # pass. A policy that fails part-way still answers with the true counts
  # and failed: true, so these invalidations fire after every purge. The
  # verify intents are on the list because a purge removes events from the
  # middle of the chain: verification reports the purged sequences as gaps
  # and the events after them as tampered.
  - { name: retention.enforce, kind: command, version: 1, capability: write,
      requires: { all: ["scope:chronicle.admin"] },
      invalidates: [retention.policies, retention.archives, retention.preview,
                    events.list, events.detail, events.aggregate, events.byUser,
                    overview.stats, verify.run, verify.event, erasures.preview] }
  - { name: retention.archives,     kind: query, version: 1, capability: read }
  # Compliance reports: SOC2, HIPAA and EU AI Act, plus custom ones, the
  # documents that go to an auditor. Every intent is confined to the viewer's
  # own app and tenant, and no request carries an appId or tenantId. The
  # generate commands persist through the engine itself and never save twice,
  # and each needs a write grant: they store up to 20 sections of embedded
  # events under the caller's name, and the transport does not check a
  # command's capability against the user.
  # reports.detail's verification is null when a report carries none, which
  # means unverified and never that verification passed.
  - { name: reports.list,           kind: query,   version: 1, capability: read }
  - { name: reports.detail,         kind: query,   version: 1, capability: read }
  - { name: reports.generate,       kind: command, version: 1, capability: write,
      requires: { any: ["scope:chronicle.write", "scope:chronicle.admin"] },
      invalidates: [reports.list] }
  - { name: reports.generateCustom, kind: command, version: 1, capability: write,
      requires: { any: ["scope:chronicle.write", "scope:chronicle.admin"] },
      invalidates: [reports.list] }
  # A query: it renders a stored report and writes nothing. The client saves
  # the returned content as a file.
  - { name: reports.export,         kind: query,   version: 1, capability: read }
  # What this deployment writes and can prove: the digest scheme it writes
  # under now, whether checkpointing is configured, and which backend it runs
  # on. Takes no input. It reports the process's configuration, so a chain
  # pinned to an older scheme is described by streams.mine, not here.
  - { name: settings.detail, kind: query, version: 1, capability: read }
